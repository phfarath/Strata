services:
  # PostgreSQL with pgvector extension (mirrors Supabase / Railway Postgres cloud database)
  db:
    image: pgvector/pgvector:pg16
    container_name: strata-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: strata_cloud
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d strata_cloud"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s

  # Strata Cloud Sync & Multi-Device SaaS Server (mirrors Railway / Cloud deployment)
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: strata-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/strata_cloud?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:-dev-local-jwt-secret-dummy-key}
      STRATA_SERVER_SECRET: ${STRATA_SERVER_SECRET:-dev-local-server-secret-dummy-key}
      HOST: 0.0.0.0
      PORT: 8080
      RUST_LOG: strata_server=debug,tower_http=info
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
    driver: local
