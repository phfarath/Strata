[workspace]
resolver = "2"
members = [
    "crates/strata-core",
    "crates/strata-memory",
    "crates/strata-tools",
    "crates/strata-reasoning",
    "crates/strata-cli",
    "crates/strata-evals",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Strata Contributors"]
license = "MIT OR Apache-2.0"
description = "Local-first persistent memory engine and cognitive runtime for AI coding agents"
repository = "https://github.com/phfarath/Strata"
homepage = "https://github.com/phfarath/Strata"
documentation = "https://docs.rs/strata-cli"
readme = "README.md"
keywords = ["memory", "mcp", "ai-agents", "cognitive", "cursor"]
categories = ["command-line-utilities", "development-tools"]


[workspace.dependencies]
# Internal crates
strata-core = { path = "crates/strata-core" }
strata-memory = { path = "crates/strata-memory" }
strata-tools = { path = "crates/strata-tools" }
strata-reasoning = { path = "crates/strata-reasoning" }
strata-cli = { path = "crates/strata-cli" }


# Async & Runtime
tokio = { version = "1.43", features = ["full"] }
async-trait = "0.1.86"
futures = "0.3.31"

# Web & HTTP
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization & Data
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
uuid = { version = "1.13", features = ["v4", "serde"] }
chrono = { version = "0.4.39", features = ["serde"] }

# Local Storage & SQLite
rusqlite = { version = "0.33", features = ["bundled", "bundled-full"] }

# Embeddings
fastembed = "4.5.1"

# CLI & Tracing
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
thiserror = "2.0.11"
anyhow = "1.0.96"
dirs = "6.0.0"
opener = "0.7.2"
toml = "0.8.19"
petgraph = { version = "0.7", features = ["serde-1"] }

# Cryptography & Hashing
sha2 = "0.10.8"
blake3 = "1.5.5"
rand = "0.8.5"
hex = "0.4.3"

# AST Parsing & Tree-Sitter
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"

# Networking & HTTP
reqwest = { version = "0.12", features = ["json"] }
