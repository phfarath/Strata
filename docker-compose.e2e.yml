services:
  # 1. PostgreSQL 16 with pgvector extension (mirrors cloud Supabase/Railway)
  db:
    image: pgvector/pgvector:pg16
    container_name: strata-db-e2e
    restart: unless-stopped
    environment:
      POSTGRES_DB: strata_cloud
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata_e2e:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d strata_cloud"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 2s

  # 2. Strata Cloud Sync & Multi-Device SaaS Server
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: strata-server-e2e
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/strata_cloud?sslmode=disable
      JWT_SECRET: dev-local-jwt-secret-dummy-key
      STRATA_SERVER_SECRET: dev-local-server-secret-dummy-key
      HOST: 0.0.0.0
      PORT: 8080
      RUST_LOG: strata_server=debug,tower_http=info
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s

  # 3. Strata React Vite Web UI
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.web
    container_name: strata-web-e2e
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8080
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://localhost:3000 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s

volumes:
  pgdata_e2e:
    driver: local
