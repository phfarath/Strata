name: Bump Version & Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump level"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: "Custom version string (e.g. 0.2.0, required only if bump_type is 'custom')"
        required: false
        type: string
      create_tag:
        description: "Create and push git tag to trigger Release build"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    name: Bump Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Calculate new SemVer version
        id: semver
        shell: bash
        run: |
          # 1. Extract current version from [workspace.package] in Cargo.toml
          CURRENT_VERSION=$(grep -m 1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "Current workspace version: $CURRENT_VERSION"

          # 2. Parse major, minor, patch
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          BUMP_TYPE="${{ github.event.inputs.bump_type }}"
          CUSTOM_VERSION="${{ github.event.inputs.custom_version }}"

          if [ "$BUMP_TYPE" = "patch" ]; then
            PATCH=$((PATCH + 1))
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          elif [ "$BUMP_TYPE" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          elif [ "$BUMP_TYPE" = "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          elif [ "$BUMP_TYPE" = "custom" ]; then
            if [ -z "$CUSTOM_VERSION" ]; then
              echo "::error::custom_version is required when bump_type is 'custom'"
              exit 1
            fi
            # Strip any leading 'v'
            NEW_VERSION="${CUSTOM_VERSION#v}"
          else
            echo "::error::Unknown bump_type: $BUMP_TYPE"
            exit 1
          fi

          echo "Target new version: $NEW_VERSION"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update Cargo.toml and Cargo.lock
        shell: bash
        run: |
          NEW_VERSION="${{ steps.semver.outputs.new_version }}"
          CURRENT_VERSION="${{ steps.semver.outputs.current_version }}"

          echo "Updating Cargo.toml workspace.package version from $CURRENT_VERSION to $NEW_VERSION..."
          sed -i -E "0,/version = \"$CURRENT_VERSION\"/{s/version = \"$CURRENT_VERSION\"/version = \"$NEW_VERSION\"/}" Cargo.toml

          echo "Updating Cargo.lock across workspace..."
          cargo check --workspace

      - name: Commit, create PR, merge, and tag
        id: release_step
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VERSION="${{ steps.semver.outputs.new_version }}"
          CURRENT_VERSION="${{ steps.semver.outputs.current_version }}"
          CREATE_TAG="${{ github.event.inputs.create_tag }}"
          BASE_BRANCH="${{ github.ref_name }}"
          RELEASE_BRANCH="release/v${NEW_VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create a dedicated release branch
          git checkout -b "$RELEASE_BRANCH"
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): bump version to v${NEW_VERSION}"

          echo "Pushing release branch $RELEASE_BRANCH..."
          git push origin "$RELEASE_BRANCH" --force

          echo "Opening release Pull Request..."
          PR_URL=$(gh pr create \
            --base "$BASE_BRANCH" \
            --head "$RELEASE_BRANCH" \
            --title "chore(release): bump version to v${NEW_VERSION}" \
            --body "Automated release version bump: \`v${CURRENT_VERSION}\` ➔ \`v${NEW_VERSION}\`.")

          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "Created PR: $PR_URL"

          # Merge PR to satisfy branch protection
          echo "Merging PR $PR_URL into $BASE_BRANCH..."
          if gh pr merge "$RELEASE_BRANCH" --squash --delete-branch; then
            echo "PR successfully merged into $BASE_BRANCH."
            git checkout "$BASE_BRANCH"
            git pull origin "$BASE_BRANCH"

            if [ "$CREATE_TAG" = "true" ]; then
              echo "Creating git tag v${NEW_VERSION} on $BASE_BRANCH..."
              git tag -a "v${NEW_VERSION}" -m "Release v${NEW_VERSION}"
              git push origin "v${NEW_VERSION}"

              echo "Dispatching Release workflow for v${NEW_VERSION}..."
              gh workflow run release.yml -f tag_name="v${NEW_VERSION}" || true
            fi
          else
            echo "::warning::PR $PR_URL created but automated merge could not be completed. Please merge manually."
          fi

      - name: Generate Summary Report
        shell: bash
        run: |
          NEW_VERSION="${{ steps.semver.outputs.new_version }}"
          CURRENT_VERSION="${{ steps.semver.outputs.current_version }}"
          CREATE_TAG="${{ github.event.inputs.create_tag }}"

          echo "## 🚀 Strata Version Bump" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Previous Version** | \`v${CURRENT_VERSION}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **New Version** | \`v${NEW_VERSION}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          if [ "$CREATE_TAG" = "true" ]; then
            echo "| **Tag Created** | \`v${NEW_VERSION}\` (Triggered Release workflow) |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📦 **Release Artifacts Pipeline**: [View Release Build Actions](https://github.com/${{ github.repository }}/actions/workflows/release.yml)" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **Tag Created** | ⚠️ Skipped by input toggle |" >> $GITHUB_STEP_SUMMARY
          fi
