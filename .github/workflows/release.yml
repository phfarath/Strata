name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Git tag to build and publish release for (e.g. v0.1.2)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate tag
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
        run: |
          TAG="$INPUT_TAG"
          if [ "$EVENT_NAME" = "push" ]; then
            TAG="$REF_NAME"
          fi

          if [ -z "$TAG" ]; then
            echo "::error::A tag_name input is required for manual releases."
            exit 1
          fi

          git fetch --tags --force

          if ! git rev-parse "refs/tags/${TAG}^{commit}" > /dev/null 2>&1; then
            echo "::error::Tag '${TAG}' does not exist in this repository."
            exit 1
          fi

          echo "Resolved release tag: ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  build-release:
    name: Build (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: strata
            archive_ext: tar.gz

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            bin_name: strata
            archive_ext: tar.gz

          - target: aarch64-apple-darwin
            os: macos-latest
            bin_name: strata
            archive_ext: tar.gz

          - target: x86_64-apple-darwin
            os: macos-latest
            bin_name: strata
            archive_ext: tar.gz

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin_name: strata.exe
            archive_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Validate checkout is the release tag
        shell: bash
        run: |
          EXPECTED="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          ACTUAL="$(git rev-parse HEAD)"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Checkout HEAD (${ACTUAL}) does not match tag ${RELEASE_TAG} (${EXPECTED})."
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release -p strata-cli --bin strata --target ${{ matrix.target }}

      - name: Package release assets (Unix)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          PKG_NAME="strata-${RELEASE_TAG}-${{ matrix.target }}"
          mkdir -p "dist/${PKG_NAME}"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "dist/${PKG_NAME}/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/${PKG_NAME}/"
          cd dist
          tar -czf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
          shasum -a 256 "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"

      - name: Package release assets (Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $pkgName = "strata-$env:RELEASE_TAG-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$pkgName" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "dist/$pkgName/"
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE "dist/$pkgName/"
          Compress-Archive -Path "dist/$pkgName" -DestinationPath "dist/$pkgName.zip"
          $hash = (Get-FileHash "dist/$pkgName.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $pkgName.zip" | Out-File "dist/$pkgName.zip.sha256" -Encoding ascii

      - name: Smoke-test packaged binary (Unix)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          PKG_NAME="strata-${RELEASE_TAG}-${{ matrix.target }}"
          mkdir -p "dist/verify-${PKG_NAME}"
          tar -xzf "dist/${PKG_NAME}.tar.gz" -C "dist/verify-${PKG_NAME}" --strip-components=1
          BIN="dist/verify-${PKG_NAME}/${{ matrix.bin_name }}"
          if [ "${{ matrix.target }}" = "x86_64-apple-darwin" ] && [ "$(uname -m)" = "arm64" ]; then
            file "$BIN" | grep -q "x86_64"
            echo "Verified cross-compiled x86_64-apple-darwin binary on arm64 runner: $(file "$BIN")"
            exit 0
          fi
          OUTPUT="$("$BIN" --version)"
          echo "$OUTPUT"
          EXPECTED_VERSION="${RELEASE_TAG#v}"
          case "$OUTPUT" in
            *"$EXPECTED_VERSION"*) ;;
            *)
              echo "::error::Packaged binary version does not match tag ${RELEASE_TAG}: ${OUTPUT}"
              exit 1
              ;;
          esac

      - name: Smoke-test packaged binary (Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $pkgName = "strata-$env:RELEASE_TAG-${{ matrix.target }}"
          $verifyDir = "dist/verify-$pkgName"
          Expand-Archive -Path "dist/$pkgName.zip" -DestinationPath $verifyDir -Force
          $bin = Join-Path $verifyDir "$pkgName/${{ matrix.bin_name }}"
          $output = & $bin --version
          $exitCode = $LASTEXITCODE
          $outputText = ($output | Out-String).Trim()
          if ($exitCode -ne 0) { throw "Packaged binary failed to run: $outputText" }
          $expected = $env:RELEASE_TAG -replace '^v', ''
          if ($outputText -notmatch [regex]::Escape($expected)) {
            throw "Packaged binary version '$outputText' does not match tag '$env:RELEASE_TAG'"
          }
          Write-Output $outputText

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
