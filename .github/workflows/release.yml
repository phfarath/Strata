name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Git tag to build and publish release for (e.g. v0.1.1)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: strata
            archive_ext: tar.gz

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            bin_name: strata
            archive_ext: tar.gz

          - target: aarch64-apple-darwin
            os: macos-latest
            bin_name: strata
            archive_ext: tar.gz

          - target: x86_64-apple-darwin
            os: macos-13
            bin_name: strata
            archive_ext: tar.gz

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin_name: strata.exe
            archive_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release -p strata-cli --bin strata --target ${{ matrix.target }}

      - name: Package release assets (Unix)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          PKG_NAME="strata-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/${PKG_NAME}"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "dist/${PKG_NAME}/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/${PKG_NAME}/"
          cd dist
          tar -czf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
          shasum -a 256 "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"

      - name: Package release assets (Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag_name || github.ref_name }}"
          $pkgName = "strata-$tag-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$pkgName" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "dist/$pkgName/"
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE "dist/$pkgName/"
          Compress-Archive -Path "dist/$pkgName" -DestinationPath "dist/$pkgName.zip"
          $hash = (Get-FileHash "dist/$pkgName.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $pkgName.zip" | Out-File "dist/$pkgName.zip.sha256" -Encoding ascii

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
